name: Validate tap

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HOMEBREW_NO_ANALYTICS: "1"
  TZ: UTC

jobs:
  validate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/validate
