name: Check cask

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: true
      - run: |
          brew style Casks/shrimply.rb
          brew audit --cask --online soirihiroka/tap/shrimply
          brew install --cask soirihiroka/tap/shrimply
          brew reinstall --cask soirihiroka/tap/shrimply
          if xattr -p com.apple.quarantine /Applications/Shrimply.app >/dev/null 2>&1; then
            exit 1
          fi
          brew uninstall --cask soirihiroka/tap/shrimply
