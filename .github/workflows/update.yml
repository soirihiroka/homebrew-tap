name: Update Shrimply

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: update-shrimply

env:
  TZ: UTC

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: Homebrew/actions/setup-homebrew@e99025eb970cfa124b8284a35463d87426917478 # 2026.09.28.1
        with:
          stable: true
          token: ${{ github.token }}
      - run: |
          cask=soirihiroka/tap/shrimply
          info="$(brew livecheck --cask --json "${cask}")"
          version="$(jq -er '.[0].version.latest' <<< "${info}")"
          if ! jq -e '.[0].version.outdated' <<< "${info}" >/dev/null; then
            exit 0
          fi
          brew bump-cask-pr --write-only --version="${version}" "${cask}"
          brew install --cask "${cask}"
          if xattr -p com.apple.quarantine /Applications/Shrimply.app >/dev/null 2>&1; then
            exit 1
          fi
          brew uninstall --cask "${cask}"
          git config user.name "$(git log -1 --format=%an)"
          git config user.email "$(git log -1 --format=%ae)"
          timestamp="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          export GIT_AUTHOR_DATE="${timestamp}" GIT_COMMITTER_DATE="${timestamp}"
          git add Casks/shrimply.rb
          git commit -m "shrimply ${version}"
          git push origin HEAD:main
